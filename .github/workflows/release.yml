name: Release

# Triggered by pushing a version tag (e.g. v1.0.0).
# Builds the four Rust binaries for every supported platform,
# packages each into a tarball, and attaches them to a GitHub release.
on:
  push:
    tags:
      - "v*"

jobs:
  # ── Build binaries for each target ──────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry / build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross is only needed for linux-aarch64 (cross-compilation on ubuntu-latest)
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binaries into tarball
        shell: bash
        run: |
          mkdir -p dist
          for b in diffgrep pickaxe-diff; do
            cp "target/${{ matrix.target }}/release/$b" dist/
          done
          tar -czf "siefe-binaries-${{ matrix.target }}.tar.gz" -C dist .

      - name: Upload tarball as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: siefe-binaries-${{ matrix.target }}
          path: siefe-binaries-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # ── Create GitHub release and attach all tarballs ───────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets

    steps:
      - uses: actions/checkout@v4

      # Download all four tarballs produced by the build jobs.
      # Uses v4 (≥ 4.1.3) which fixes the arbitrary-file-write CVE.
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
